<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coco Pine Cassette | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 1. Background Image and Layout */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), 
                        url('login_bg.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
        }

        /* 2. Login Form Container */
        .form-signin {
            max-width: 380px;
            padding: 2.5rem;
            background-color: rgba(18, 18, 18, 0.9); 
            border-radius: 21px;
            border: 2px solid #333;
            box-shadow: 0 15px 35px rgba(209, 50, 90, 0.3);
            backdrop-filter: blur(5px);
        }

        /* NEW: Icon Image Styling */
        .login-icon {
            width: 100px; /* Adjust size as needed */
            height: auto;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 10px rgba(209, 50, 90, 0.5)); /* Adds a slight pink glow to your icon */
        }

        .form-signin h1 {
            color: #d1325a;
            font-weight: 800;
        }

        /* 3. Input Styling */
        .form-control {
            background-color: rgba(26, 26, 26, 0.8) !important;
            color: white !important;
            border-color: #444;
        }

        .form-control:focus {
            border-color: #d1325a !important;
            box-shadow: 0 0 0 0.25rem rgba(209, 50, 90, 0.25) !important;
        }

        .form-signin input[type="email"] {
            margin-bottom: -1px;
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 0;
        }

        .form-signin input[type="password"] {
            margin-bottom: 15px;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }

        /* 4. Button & Links */
        .btn-primary {
            background-color: #d1325a !important;
            border-color: #d1325a !important;
            font-weight: 800;
            text-transform: uppercase;
        }

        .btn-primary:hover {
            background-color: #b0264a !important;
            transform: translateY(-1px);
        }

        .navbar {
            border-bottom: 1px solid #d1325a;
        }

        .navbar-brand {
            color: #d1325a !important;
        }

        .navbar-dark .navbar-nav .nav-link.active {
            color: #d1325a !important;
        }
        
        label {
            color: #bdc3c7 !important;
        }
    </style>
</head>
<body class="d-flex flex-column">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Coco Pine Cassette</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="product.html">Product</a></li>
        <li class="nav-item"><a class="nav-link" href="detail.html">Details</a></li>
        <li class="nav-item"><a class="nav-link" href="checkout.html">Checkout</a></li>
        <li class="nav-item"><a class="nav-link active btn btn-outline-light ms-lg-3 px-3" href="login.html" style="border-color: #d1325a;">Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="form-signin w-100 m-auto text-center mt-5">
  <form>
    <img src="coco_pine_icon.png" alt="Coco Pine Cassette Icon" class="login-icon">
    
    <h1 class="h3 mb-4 fw-normal">Member Sign-In</h1>

    <div class="form-floating">
      <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" required>
      <label for="floatingInput">Email address</label>
    </div>
    <div class="form-floating">
      <input type="password" class="form-control" id="floatingPassword" placeholder="Password" required>
      <label for="floatingPassword">Password</label>
    </div>

    <div class="form-check text-start my-3">
      <input class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault">
      <label class="form-check-label" for="flexCheckDefault">
        Remember me
      </label>
    </div>
    <button class="w-100 btn btn-lg btn-primary" type="submit">Login Now</button>
    <p class="mt-5 mb-3 text-body-secondary">&copy; 2026 Coco Pine Cassette</p>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
